const { useState, useEffect, useRef, useCallback, useContext, createContext } = React;

/* ============================================================
   STANDALONE STORAGE LAYER
   Replaces Claude's window.storage with the browser's own
   localStorage, so this file works with no backend at all.
   Data stays on this device/browser only. Swap this block out
   for a real API (Supabase, Firebase, your own server, etc.)
   if you want data synced across devices.
   ============================================================ */
const localStore = {
  async get(key) {
    try {
      const v = localStorage.getItem(key);
      return v !== null ? { key, value: v } : null;
    } catch (e) {
      console.error("localStorage read failed", e);
      return null;
    }
  },
  async set(key, value) {
    try {
      localStorage.setItem(key, value);
      return { key, value };
    } catch (e) {
      console.error("localStorage write failed", e);
      return null;
    }
  },
  async delete(key) {
    try {
      localStorage.removeItem(key);
      return { key, deleted: true };
    } catch (e) {
      console.error("localStorage delete failed", e);
      return null;
    }
  },
};

const CurrencyContext = createContext("$");
function useCurrency() {
  return useContext(CurrencyContext);
}

      strokeLinecap="round" strokeLinejoin="round" style={{ display: "block", flexShrink: 0, ...style }}>
      {path}
    </svg>
  );
}

function formatMoney(n, currency = "$") {
  return `${currency}${Number(n).toFixed(2)}`;
}
function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

// ---- Storage helpers (now backed by localStorage) ----
async function loadIndex() {
  try {
    const res = await localStore.get("items-index");
    return res ? JSON.parse(res.value) : [];
  } catch { return []; }
}
async function saveIndex(barcodes) {
  try { await localStore.set("items-index", JSON.stringify(barcodes)); }
  catch (e) { console.error("Failed saving index", e); }
}
async function loadItem(barcode) {
  try {
    const res = await localStore.get(`item:${barcode}`);
    return res ? JSON.parse(res.value) : null;
  } catch { return null; }
}
async function saveItem(item) {
  try { await localStore.set(`item:${item.barcode}`, JSON.stringify(item)); }
  catch (e) { console.error("Failed saving item", e); }
}

// ---- Barcode scan overlay ----
function ScannerOverlay({ onDetected, onClose }) {
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const rafRef = useRef(null);
  const [status, setStatus] = useState("starting");
  const [manualMode, setManualMode] = useState(false);
  const [manualValue, setManualValue] = useState("");

  useEffect(() => {
    let cancelled = false;
    async function start() {
      if (!("BarcodeDetector" in window)) {
        setStatus("unsupported"); setManualMode(true); return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        if (cancelled) { stream.getTracks().forEach((t) => t.stop()); return; }
        streamRef.current = stream;
        if (videoRef.current) { videoRef.current.srcObject = stream; await videoRef.current.play(); }
        setStatus("live");
        const detector = new window.BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "qr_code"] });
        const tick = async () => {
          if (cancelled || !videoRef.current) return;
          try {
            const codes = await detector.detect(videoRef.current);
            if (codes && codes.length > 0) { onDetected(codes[0].rawValue); return; }
          } catch {}
          rafRef.current = requestAnimationFrame(tick);
        };
        rafRef.current = requestAnimationFrame(tick);
      } catch (err) {
        if (!cancelled) { setStatus("denied"); setManualMode(true); }
      }
    }
    start();
    return () => {
      cancelled = true;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop());
    };
  }, [onDetected]);

  return (
    <div style={{ position: "fixed", inset: 0, background: COLORS.coverDark, zIndex: 50, display: "flex", flexDirection: "column" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 18px" }}>
        <span style={{ color: COLORS.paper, fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, letterSpacing: "0.08em", textTransform: "uppercase" }}>Scan Barcode</span>
        <button onClick={onClose} style={{ background: "transparent", border: "none", color: COLORS.paper, padding: 6, cursor: "pointer" }} aria-label="Close scanner">
          <XIcon size={22} />
        </button>
      </div>

      {!manualMode && (
        <div style={{ position: "relative", flex: 1, overflow: "hidden" }}>
          <video ref={videoRef} muted playsInline style={{ width: "100%", height: "100%", objectFit: "cover" }} />
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", pointerEvents: "none" }}>
            <div style={{ width: "78%", maxWidth: 320, height: 130, border: `2px solid ${COLORS.gold}`, borderRadius: 4, boxShadow: "0 0 0 2000px rgba(22,40,31,0.45)" }} />
          </div>
          {status === "starting" && (
            <p style={{ position: "absolute", bottom: 24, width: "100%", textAlign: "center", color: COLORS.paper, fontFamily: "'IBM Plex Mono', monospace", fontSize: 12 }}>opening camera…</p>
          )}
          <button onClick={() => setManualMode(true)} style={{ position: "absolute", bottom: 24, left: "50%", transform: "translateX(-50%)", background: COLORS.paper, color: COLORS.ink, border: "none", borderRadius: 20, padding: "10px 18px", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, cursor: "pointer" }}>
            Type barcode instead
          </button>
        </div>
      )}

      {manualMode && (
        <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", padding: "0 28px", gap: 16 }}>
          {(status === "unsupported" || status === "denied") && (
            <div style={{ display: "flex", gap: 8, color: COLORS.paperDark, fontSize: 12.5, fontFamily: "'IBM Plex Mono', monospace", lineHeight: 1.5 }}>
              <AlertCircleIcon size={16} style={{ marginTop: 1 }} />
              <span>{status === "denied"
                ? "Camera access wasn't available. Enter the barcode number instead — it's usually printed under the bars."
                : "This browser can't scan barcodes automatically. Enter the number instead — it's usually printed under the bars."}</span>
            </div>
          )}
          <input autoFocus inputMode="numeric" value={manualValue} onChange={(e) => setManualValue(e.target.value.replace(/[^0-9]/g, ""))} placeholder="e.g. 041220576453"
            style={{ background: COLORS.paper, border: `1.5px solid ${COLORS.gold}`, borderRadius: 8, padding: "14px 16px", fontSize: 20, letterSpacing: "0.06em", fontFamily: "'IBM Plex Mono', monospace", color: COLORS.ink, outline: "none" }} />
          <button disabled={manualValue.length < 3} onClick={() => onDetected(manualValue)}
            style={{ background: manualValue.length < 3 ? COLORS.inkSoft : COLORS.stamp, color: COLORS.paper, border: "none", borderRadius: 8, padding: "13px 16px", fontFamily: "'IBM Plex Mono', monospace", fontSize: 14, letterSpacing: "0.05em", cursor: manualValue.length < 3 ? "default" : "pointer", opacity: manualValue.length < 3 ? 0.6 : 1 }}>
            Look up
          </button>
        </div>
      )}
    </div>
  );
}

// ---- Bulk import overlay ----
// Accepts a JSON array like: [{"barcode":"652029","name":"Dog Chow Triple P","price":581.25,"store":"Costco"}, ...]
function ImportOverlay({ onImport, onClose, currency }) {
  const [text, setText] = useState("");
  const [error, setError] = useState("");
  const [preview, setPreview] = useState(null);

  const parse = () => {
    setError("");
    try {
      const data = JSON.parse(text);
      if (!Array.isArray(data)) throw new Error("Expected a list of items in [ ] brackets.");
      const cleaned = data.map((row, i) => {
        if (!row.name || row.price === undefined || isNaN(parseFloat(row.price))) {
          throw new Error(`Row ${i + 1} needs at least a name and a price.`);
        }
        return {
          barcode: String(row.barcode || row.name).replace(/\s+/g, "-").toLowerCase(),
          name: String(row.name),
          price: parseFloat(row.price),
          store: row.store || "",
          weight: row.weight || "",
          quantity: row.quantity !== undefined && row.quantity !== "" ? row.quantity : "",
          category: row.category || "",
          date: row.date || new Date().toISOString(),
        };
      });
      setPreview(cleaned);
    } catch (e) {
      setError(e.message || "Couldn't read that as a list of items.");
      setPreview(null);
    }
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: COLORS.coverDark, zIndex: 50, display: "flex", flexDirection: "column" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 18px" }}>
        <span style={{ color: COLORS.paper, fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, letterSpacing: "0.08em", textTransform: "uppercase" }}>Import Items</span>
        <button onClick={onClose} style={{ background: "transparent", border: "none", color: COLORS.paper, padding: 6, cursor: "pointer" }} aria-label="Close import">
          <XIcon size={22} />
        </button>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "0 18px 24px", display: "flex", flexDirection: "column", gap: 12 }}>
        {!preview && (
          <>
            <p style={{ color: COLORS.paperDark, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, lineHeight: 1.6 }}>
              Paste a list of items as JSON. Each item needs a name and price; barcode and store are optional.
            </p>
            <textarea value={text} onChange={(e) => setText(e.target.value)}
              placeholder={'[\n  {"barcode":"652029","name":"Dog Chow Triple P","price":581.25,"store":"Costco","weight":"907g","quantity":1,"category":"Household"}\n]'}
              rows={12}
              style={{ background: COLORS.paper, border: `1.5px solid ${COLORS.gold}`, borderRadius: 8, padding: 12, fontSize: 12.5, fontFamily: "'IBM Plex Mono', monospace", color: COLORS.ink, outline: "none", resize: "vertical" }} />
            {error && (
              <div style={{ display: "flex", gap: 8, color: "#E8A499", fontSize: 12, fontFamily: "'IBM Plex Mono', monospace" }}>
                <AlertCircleIcon size={15} style={{ marginTop: 1 }} />
                <span>{error}</span>
              </div>
            )}
            <button disabled={text.trim().length === 0} onClick={parse}
              style={{ background: text.trim().length === 0 ? COLORS.inkSoft : COLORS.stamp, color: COLORS.paper, border: "none", borderRadius: 8, padding: "13px 16px", fontFamily: "'IBM Plex Mono', monospace", fontSize: 14, cursor: text.trim().length === 0 ? "default" : "pointer", opacity: text.trim().length === 0 ? 0.6 : 1 }}>
              Preview
            </button>
          </>
        )}

        {preview && (
          <>
            <p style={{ color: COLORS.paperDark, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5 }}>{preview.length} item{preview.length === 1 ? "" : "s"} ready to add:</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: "50vh", overflowY: "auto" }}>
              {preview.map((row, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", background: COLORS.paper, borderRadius: 6, padding: "8px 12px" }}>
                  <span style={{ fontFamily: "'Newsreader', Georgia, serif", fontSize: 13.5, color: COLORS.ink }}>
                    {row.name}
                    {(row.weight || row.quantity || row.category) && (
                      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10.5, color: COLORS.inkSoft, marginLeft: 6 }}>
                        {[row.category, row.quantity && `x${row.quantity}`, row.weight].filter(Boolean).join(" · ")}
                      </span>
                    )}
                  </span>
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: COLORS.stamp, fontWeight: 600, flexShrink: 0, marginLeft: 10 }}>{formatMoney(row.price, currency)}</span>
                </div>
              ))}
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={() => setPreview(null)} style={{ ...btnStyle, background: "transparent", border: `1.5px solid ${COLORS.paperDark}`, color: COLORS.paper, flex: 1 }}>Back</button>
              <button onClick={() => onImport(preview)} style={{ ...btnStyle, background: COLORS.stamp, color: COLORS.paper, flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                <CheckIcon size={15} /> Add {preview.length} item{preview.length === 1 ? "" : "s"}
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function Sparkline({ prices }) {
  if (prices.length < 2) return null;
  const vals = prices.map((p) => p.price);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  const w = 72, h = 24;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1)) * w},${h - ((v - min) / range) * h}`);
  return (
    <svg width={w} height={h} style={{ display: "block" }}>
      <polyline points={pts.join(" ")} fill="none" stroke={COLORS.gold} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function TrendBadge({ prices }) {
  const currency = useCurrency();
  if (prices.length < 2) return null;
  const sorted = [...prices].sort((a, b) => new Date(a.date) - new Date(b.date));
  const latest = sorted[sorted.length - 1].price;
  const prev = sorted[sorted.length - 2].price;
  const min = Math.min(...prices.map((p) => p.price));
  if (latest <= min && latest < prev) {
    return <span style={{ display: "inline-flex", alignItems: "center", gap: 3, color: COLORS.goodGreen, fontSize: 10.5, fontFamily: "'IBM Plex Mono', monospace" }}><TrendingDownIcon size={11} /> NEW LOW</span>;
  }
  if (latest > prev) {
    return <span style={{ display: "inline-flex", alignItems: "center", gap: 3, color: COLORS.stamp, fontSize: 10.5, fontFamily: "'IBM Plex Mono', monospace" }}><TrendingUpIcon size={11} /> UP {formatMoney(latest - prev, currency)}</span>;
  }
  if (latest < prev) {
    return <span style={{ display: "inline-flex", alignItems: "center", gap: 3, color: COLORS.goodGreen, fontSize: 10.5, fontFamily: "'IBM Plex Mono', monospace" }}><TrendingDownIcon size={11} /> DOWN {formatMoney(prev - latest, currency)}</span>;
  }
  return <span style={{ display: "inline-flex", alignItems: "center", gap: 3, color: COLORS.inkSoft, fontSize: 10.5, fontFamily: "'IBM Plex Mono', monospace" }}><MinusIcon size={11} /> SAME</span>;
}

function PriceForm({ initial, onSave, onCancel }) {
  const [name, setName] = useState(initial?.name || "");
  const [price, setPrice] = useState("");
  const [store, setStore] = useState("");
  const [weight, setWeight] = useState("");
  const [quantity, setQuantity] = useState("");
  const [category, setCategory] = useState(initial?.category || "");
  const canSave = name.trim().length > 0 && price !== "" && !isNaN(parseFloat(price));

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <label style={fieldLabelStyle}>Item name</label>
      <input value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Kirkland Paper Towels" style={fieldStyle} />
      <label style={fieldLabelStyle}>Category (optional)</label>
      <select value={category} onChange={(e) => setCategory(e.target.value)} style={{ ...fieldStyle, appearance: "auto" }}>
        <option value="">No category</option>
        {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
      </select>
      <label style={fieldLabelStyle}>Price paid</label>
      <div style={{ position: "relative" }}>
        <span style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", color: COLORS.inkSoft, fontFamily: "'IBM Plex Mono', monospace" }}>{useCurrency()}</span>
        <input inputMode="decimal" value={price} onChange={(e) => setPrice(e.target.value.replace(/[^0-9.]/g, ""))} placeholder="0.00" style={{ ...fieldStyle, paddingLeft: 26 }} />
      </div>
      <div style={{ display: "flex", gap: 10 }}>
        <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 12 }}>
          <label style={fieldLabelStyle}>Weight (optional)</label>
          <input value={weight} onChange={(e) => setWeight(e.target.value)} placeholder="e.g. 907g" style={fieldStyle} />
        </div>
        <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 12 }}>
          <label style={fieldLabelStyle}>Quantity (optional)</label>
          <input value={quantity} onChange={(e) => setQuantity(e.target.value)} placeholder="e.g. 2" style={fieldStyle} />
        </div>
      </div>
      <label style={fieldLabelStyle}>Store (optional)</label>
      <input value={store} onChange={(e) => setStore(e.target.value)} placeholder="e.g. Costco" style={fieldStyle} />
      <div style={{ display: "flex", gap: 10, marginTop: 6 }}>
        <button onClick={onCancel} style={{ ...btnStyle, background: "transparent", border: `1.5px solid ${COLORS.inkSoft}`, color: COLORS.ink, flex: 1 }}>Cancel</button>
        <button disabled={!canSave} onClick={() => canSave && onSave({ name: name.trim(), price: parseFloat(price), store: store.trim(), weight: weight.trim(), quantity: quantity.trim(), category, date: new Date().toISOString() })}
          style={{ ...btnStyle, background: canSave ? COLORS.stamp : COLORS.inkSoft, color: COLORS.paper, flex: 1, opacity: canSave ? 1 : 0.6, cursor: canSave ? "pointer" : "default" }}>
          Save price
        </button>
      </div>
    </div>
  );
}

const fieldLabelStyle = { fontFamily: "'IBM Plex Mono', monospace", fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: COLORS.inkSoft, marginBottom: -6 };
const fieldStyle = { background: "#fff", border: `1.5px solid ${COLORS.paperDark}`, borderRadius: 7, padding: "11px 14px", fontSize: 15, fontFamily: "'Newsreader', Georgia, serif", color: COLORS.ink, outline: "none" };
const btnStyle = { border: "none", borderRadius: 7, padding: "12px 14px", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, letterSpacing: "0.03em", cursor: "pointer" };

function EntryEditForm({ entry, currency, onSave, onCancel }) {
  const [price, setPrice] = useState(String(entry.price));
  const [weight, setWeight] = useState(entry.weight || "");
  const [quantity, setQuantity] = useState(entry.quantity || "");
  const [store, setStore] = useState(entry.store || "");
  const [date, setDate] = useState(entry.date.slice(0, 10));
  const canSave = price !== "" && !isNaN(parseFloat(price));

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8, background: "#fff", border: `1px solid ${COLORS.paperDark}`, borderRadius: 8, padding: 12, margin: "6px 0" }}>
      <div style={{ display: "flex", gap: 8 }}>
        <div style={{ position: "relative", flex: 1 }}>
          <span style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", fontFamily: "'IBM Plex Mono', monospace", color: COLORS.inkSoft, fontSize: 13 }}>{currency}</span>
          <input inputMode="decimal" value={price} onChange={(e) => setPrice(e.target.value.replace(/[^0-9.]/g, ""))} style={{ ...fieldStyle, padding: "8px 10px 8px 24px", fontSize: 13 }} />
        </div>
        <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={{ ...fieldStyle, padding: "8px 10px", fontSize: 13 }} />
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <input value={weight} onChange={(e) => setWeight(e.target.value)} placeholder="Weight" style={{ ...fieldStyle, padding: "8px 10px", fontSize: 13, flex: 1 }} />
        <input value={quantity} onChange={(e) => setQuantity(e.target.value)} placeholder="Quantity" style={{ ...fieldStyle, padding: "8px 10px", fontSize: 13, flex: 1 }} />
      </div>
      <input value={store} onChange={(e) => setStore(e.target.value)} placeholder="Store" style={{ ...fieldStyle, padding: "8px 10px", fontSize: 13 }} />
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={onCancel} style={{ ...btnStyle, flex: 1, background: "transparent", border: `1.5px solid ${COLORS.inkSoft}`, color: COLORS.ink, padding: 8 }}>Cancel</button>
        <button disabled={!canSave} onClick={() => canSave && onSave({ price: parseFloat(price), weight: weight.trim(), quantity: quantity.trim(), store: store.trim(), date: new Date(`${date}T12:00:00`).toISOString() })}
          style={{ ...btnStyle, flex: 1, background: canSave ? COLORS.stamp : COLORS.inkSoft, color: COLORS.paper, padding: 8, opacity: canSave ? 1 : 0.6 }}>
          Save
        </button>
      </div>
    </div>
  );
}

function DetailsEditForm({ item, onSave, onCancel }) {
  const [name, setName] = useState(item.name);
  const [category, setCategory] = useState(item.category || "");
  const canSave = name.trim().length > 0;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
      <input value={name} onChange={(e) => setName(e.target.value)} style={{ ...fieldStyle, fontSize: 18, fontWeight: 600 }} />
      <select value={category} onChange={(e) => setCategory(e.target.value)} style={{ ...fieldStyle, appearance: "auto", fontSize: 13 }}>
        <option value="">No category</option>
        {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
      </select>
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={onCancel} style={{ ...btnStyle, flex: 1, background: "transparent", border: `1.5px solid ${COLORS.inkSoft}`, color: COLORS.ink, padding: 8 }}>Cancel</button>
        <button disabled={!canSave} onClick={() => canSave && onSave({ name: name.trim(), category })}
          style={{ ...btnStyle, flex: 1, background: canSave ? COLORS.stamp : COLORS.inkSoft, color: COLORS.paper, padding: 8, opacity: canSave ? 1 : 0.6 }}>
          Save
        </button>
      </div>
    </div>
  );
}

function ItemDetail({ barcode, item, onBack, onAddPrice, onDeleteItem, onEditDetails, onEditEntry, onDeleteEntry }) {
  const currency = useCurrency();
  const [adding, setAdding] = useState(!item);
  const [editingDetails, setEditingDetails] = useState(false);
  const [editingEntryIdx, setEditingEntryIdx] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(false);
  if (!item && !adding) return null;
  const sorted = item ? [...item.prices].sort((a, b) => new Date(b.date) - new Date(a.date)) : [];
  const lowest = item ? Math.min(...item.prices.map((p) => p.price)) : null;

  return (
    <div style={{ padding: "18px 18px 32px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <button onClick={onBack} style={{ display: "flex", alignItems: "center", gap: 4, background: "transparent", border: "none", color: COLORS.inkSoft, fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5, padding: "6px 0 14px", cursor: "pointer" }}>
          <ChevronLeftIcon size={16} /> Back
        </button>
        {item && !adding && !editingDetails && (
          <button onClick={() => setConfirmDelete(true)} aria-label="Delete item" style={{ background: "transparent", border: "none", color: COLORS.stamp, padding: 6, cursor: "pointer" }}>
            <TrashIcon size={18} />
          </button>
        )}
      </div>

      {confirmDelete && (
        <div style={{ background: "#fff", border: `1.5px solid ${COLORS.stamp}`, borderRadius: 8, padding: 14, marginBottom: 16, display: "flex", flexDirection: "column", gap: 10 }}>
          <p style={{ fontFamily: "'Newsreader', Georgia, serif", fontSize: 14, color: COLORS.ink, margin: 0 }}>Delete "{item.name}" and its whole price history? This can't be undone.</p>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => setConfirmDelete(false)} style={{ ...btnStyle, flex: 1, background: "transparent", border: `1.5px solid ${COLORS.inkSoft}`, color: COLORS.ink, padding: 8 }}>Cancel</button>
            <button onClick={() => onDeleteItem(barcode)} style={{ ...btnStyle, flex: 1, background: COLORS.stamp, color: COLORS.paper, padding: 8 }}>Delete</button>
          </div>
        </div>
      )}

      {item && !adding && (
        <>
          {editingDetails ? (
            <DetailsEditForm item={item} onCancel={() => setEditingDetails(false)} onSave={(fields) => { onEditDetails(barcode, fields); setEditingDetails(false); }} />
          ) : (
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <h2 style={{ fontFamily: "'Newsreader', Georgia, serif", fontSize: 22, fontWeight: 600, color: COLORS.ink, margin: 0 }}>{item.name}</h2>
                  <button onClick={() => setEditingDetails(true)} aria-label="Edit item details" style={{ background: "transparent", border: "none", color: COLORS.inkSoft, padding: 2, cursor: "pointer" }}>
                    <PencilIcon size={13} />
                  </button>
                </div>
                <p style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, color: COLORS.inkSoft, marginTop: 4, letterSpacing: "0.04em" }}>#{barcode}{item.category && ` · ${item.category}`}</p>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 26, fontWeight: 600, color: COLORS.stamp }}>{formatMoney(sorted[0].price, currency)}</div>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: COLORS.inkSoft }}>last paid · lowest {formatMoney(lowest, currency)}</div>
              </div>
            </div>
          )}

          <button onClick={() => setAdding(true)} style={{ ...btnStyle, background: COLORS.cover, color: COLORS.paper, width: "100%", marginTop: 18, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
            <PlusIcon size={15} /> Log a new price
          </button>

          <p style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10.5, letterSpacing: "0.1em", textTransform: "uppercase", color: COLORS.inkSoft, marginTop: 26, marginBottom: 10 }}>History ({item.prices.length})</p>
          <div style={{ display: "flex", flexDirection: "column" }}>
            {sorted.map((p) => {
              const originalIdx = item.prices.indexOf(p);
              if (editingEntryIdx === originalIdx) {
                return (
                  <EntryEditForm key={originalIdx} entry={p} currency={currency}
                    onCancel={() => setEditingEntryIdx(null)}
                    onSave={(updated) => { onEditEntry(barcode, originalIdx, updated); setEditingEntryIdx(null); }} />
                );
              }
              return (
                <div key={originalIdx} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderTop: `1px dashed ${COLORS.paperDark}` }}>
                  <div>
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 15, color: COLORS.ink, fontWeight: 600 }}>{formatMoney(p.price, currency)}</div>
                    <div style={{ display: "flex", gap: 8, marginTop: 2, color: COLORS.inkSoft, fontSize: 11, fontFamily: "'Newsreader', Georgia, serif", flexWrap: "wrap" }}>
                      <span style={{ display: "flex", alignItems: "center", gap: 3 }}><CalendarIcon size={11} /> {formatDate(p.date)}</span>
                      {p.store && <span style={{ display: "flex", alignItems: "center", gap: 3 }}><StoreIcon size={11} /> {p.store}</span>}
                      {p.quantity && <span>· x{p.quantity}</span>}
                      {p.weight && <span>· {p.weight}</span>}
                    </div>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
                    {p.price === lowest && <TagIcon size={15} color={COLORS.goodGreen} />}
                    <button onClick={() => setEditingEntryIdx(originalIdx)} aria-label="Edit this price" style={{ background: "transparent", border: "none", color: COLORS.inkSoft, padding: 3, cursor: "pointer" }}>
                      <PencilIcon size={13} />
                    </button>
                    <button onClick={() => onDeleteEntry(barcode, originalIdx)} aria-label="Delete this price" style={{ background: "transparent", border: "none", color: COLORS.stamp, padding: 3, cursor: "pointer" }}>
                      <TrashIcon size={13} />
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </>
      )}

      {adding && (
        <div style={{ marginTop: item ? 6 : 0 }}>
          {!item && <p style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, color: COLORS.inkSoft, marginBottom: 16 }}>New item · #{barcode}</p>}
          <PriceForm initial={item} onCancel={() => (item ? setAdding(false) : onBack())} onSave={(entry) => { onAddPrice(entry); setAdding(false); }} />
        </div>
      )}
    </div>
  );
}

function PriceLedger() {
  const [items, setItems] = useState({});
  const [loading, setLoading] = useState(true);
  const [scanning, setScanning] = useState(false);
  const [selectedBarcode, setSelectedBarcode] = useState(null);
  const [query, setQuery] = useState("");
  const [currency, setCurrency] = useState("$");
  const [editingCurrency, setEditingCurrency] = useState(false);
  const [importing, setImporting] = useState(false);
  const [categoryFilter, setCategoryFilter] = useState(null);
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");
  const [showDateFilter, setShowDateFilter] = useState(false);

  useEffect(() => {
    async function init() {
      const index = await loadIndex();
      const loaded = {};
      for (const bc of index) {
        const it = await loadItem(bc);
        if (it) loaded[bc] = it;
      }
      setItems(loaded);
      try {
        const settings = await localStore.get("settings");
        if (settings) {
          const parsed = JSON.parse(settings.value);
          if (parsed.currency) setCurrency(parsed.currency);
        }
      } catch {}
      setLoading(false);
    }
    init();
  }, []);

  const updateCurrency = async (val) => {
    const symbol = val.trim() || "$";
    setCurrency(symbol);
    setEditingCurrency(false);
    try { await localStore.set("settings", JSON.stringify({ currency: symbol })); }
    catch (e) { console.error("Failed saving currency setting", e); }
  };

  const handleDetected = useCallback(async (barcode) => {
    setScanning(false);
    setSelectedBarcode(barcode);
  }, []);

  const handleAddPrice = async (barcode, rawEntry) => {
    const { category, ...entry } = rawEntry;
    setItems((prev) => {
      const existing = prev[barcode];
      const item = existing
        ? { ...existing, name: entry.name || existing.name, category: category || existing.category, prices: [...existing.prices, entry] }
        : { barcode, name: entry.name, category: category || "", prices: [entry] };
      const updated = { ...prev, [barcode]: item };
      saveItem(item);
      if (!existing) {
        loadIndex().then((idx) => { if (!idx.includes(barcode)) saveIndex([...idx, barcode]); });
      }
      return updated;
    });
  };

  const handleDeleteItem = async (barcode) => {
    setItems((prev) => {
      const updated = { ...prev };
      delete updated[barcode];
      return updated;
    });
    try { await localStore.delete(`item:${barcode}`); } catch (e) { console.error("Failed deleting item", e); }
    const idx = await loadIndex();
    await saveIndex(idx.filter((b) => b !== barcode));
    setSelectedBarcode(null);
  };

  const handleEditDetails = async (barcode, fields) => {
    const existing = items[barcode];
    if (!existing) return;
    const item = { ...existing, ...fields };
    setItems((prev) => ({ ...prev, [barcode]: item }));
    saveItem(item);
  };

  const handleEditEntry = async (barcode, index, updatedFields) => {
    const existing = items[barcode];
    if (!existing) return;
    const prices = existing.prices.map((p, i) => (i === index ? { ...p, ...updatedFields } : p));
    const item = { ...existing, prices };
    setItems((prev) => ({ ...prev, [barcode]: item }));
    saveItem(item);
  };

  const handleDeleteEntry = async (barcode, index) => {
    const existing = items[barcode];
    if (!existing) return;
    const remaining = existing.prices.filter((_, i) => i !== index);
    if (remaining.length === 0) {
      await handleDeleteItem(barcode);
      return;
    }
    const item = { ...existing, prices: remaining };
    setItems((prev) => ({ ...prev, [barcode]: item }));
    saveItem(item);
  };

  const handleImport = async (rows) => {
    setItems((prev) => {
      const updated = { ...prev };
      const newBarcodes = [];
      for (const row of rows) {
        const entry = { price: row.price, store: row.store, date: row.date, weight: row.weight, quantity: row.quantity };
        const existing = updated[row.barcode];
        if (existing) {
          updated[row.barcode] = { ...existing, name: row.name || existing.name, category: row.category || existing.category, prices: [...existing.prices, entry] };
        } else {
          updated[row.barcode] = { barcode: row.barcode, name: row.name, category: row.category || "", prices: [entry] };
          newBarcodes.push(row.barcode);
        }
      }
      Object.values(updated).forEach((it) => saveItem(it));
      if (newBarcodes.length) {
        loadIndex().then((idx) => {
          const merged = Array.from(new Set([...idx, ...newBarcodes]));
          saveIndex(merged);
        });
      }
      return updated;
    });
    setImporting(false);
  };

  const list = Object.values(items)
    .filter((it) => it.name.toLowerCase().includes(query.toLowerCase()))
    .filter((it) => !categoryFilter || it.category === categoryFilter)
    .filter((it) => {
      if (!dateFrom && !dateTo) return true;
      return it.prices.some((p) => {
        const d = p.date.slice(0, 10);
        if (dateFrom && d < dateFrom) return false;
        if (dateTo && d > dateTo) return false;
        return true;
      });
    })
    .sort((a, b) => new Date(b.prices[b.prices.length - 1].date) - new Date(a.prices[a.prices.length - 1].date));

  const usedCategories = Array.from(new Set(Object.values(items).map((it) => it.category).filter(Boolean)));

  const selectedItem = selectedBarcode ? items[selectedBarcode] : null;

  return (
    <CurrencyContext.Provider value={currency}>
      <div style={{ minHeight: "100vh", background: COLORS.paper, fontFamily: "'Newsreader', Georgia, serif" }}>
        <style>{`
          @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
          * { box-sizing: border-box; }
          input:focus { border-color: ${COLORS.stamp} !important; }
          ::placeholder { color: ${COLORS.paperDark}; opacity: 1; }
        `}</style>

        <div style={{ background: COLORS.cover, padding: "22px 18px 20px", borderBottom: `4px solid ${COLORS.gold}` }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <p style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10.5, letterSpacing: "0.18em", color: COLORS.gold, margin: 0, textTransform: "uppercase" }}>Price Ledger</p>
            {editingCurrency ? (
              <input autoFocus defaultValue={currency} maxLength={4} onBlur={(e) => updateCurrency(e.target.value)} onKeyDown={(e) => e.key === "Enter" && updateCurrency(e.target.value)}
                style={{ width: 52, background: COLORS.paper, border: "none", borderRadius: 5, padding: "3px 6px", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: COLORS.ink, textAlign: "center" }} />
            ) : (
              <button onClick={() => setEditingCurrency(true)} style={{ display: "flex", alignItems: "center", gap: 4, background: "transparent", border: `1px solid ${COLORS.gold}`, borderRadius: 12, padding: "3px 9px", cursor: "pointer" }}>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: COLORS.gold }}>{currency}</span>
                <PencilIcon size={10} color={COLORS.gold} />
              </button>
            )}
          </div>
          <h1 style={{ fontFamily: "'Newsreader', Georgia, serif", fontStyle: "italic", fontSize: 26, color: COLORS.paper, margin: "2px 0 0", fontWeight: 500 }}>What I paid, and where</h1>
        </div>

        {selectedBarcode ? (
          <ItemDetail barcode={selectedBarcode} item={selectedItem} onBack={() => setSelectedBarcode(null)} onAddPrice={(entry) => handleAddPrice(selectedBarcode, entry)}
            onDeleteItem={handleDeleteItem} onEditDetails={handleEditDetails} onEditEntry={handleEditEntry} onDeleteEntry={handleDeleteEntry} />
        ) : (
          <div style={{ padding: "16px 18px 100px" }}>
            <div style={{ display: "flex", gap: 10, marginBottom: 18 }}>
              <div style={{ position: "relative", flex: 1 }}>
                <SearchIcon size={16} style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: COLORS.inkSoft }} />
                <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search your items…" style={{ ...fieldStyle, paddingLeft: 36, width: "100%" }} />
              </div>
              <button onClick={() => setImporting(true)} aria-label="Import items" style={{ background: COLORS.cover, border: "none", borderRadius: 7, padding: "0 14px", cursor: "pointer", display: "flex", alignItems: "center" }}>
                <UploadIcon size={17} color={COLORS.paper} />
              </button>
              <button onClick={() => setShowDateFilter((v) => !v)} aria-label="Filter by date" style={{ background: dateFrom || dateTo ? COLORS.stamp : COLORS.cover, border: "none", borderRadius: 7, padding: "0 14px", cursor: "pointer", display: "flex", alignItems: "center" }}>
                <CalendarIcon size={17} color={COLORS.paper} />
              </button>
            </div>

            {showDateFilter && (
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14, background: "#fff", border: `1px solid ${COLORS.paperDark}`, borderRadius: 8, padding: "10px 12px" }}>
                <div style={{ display: "flex", flexDirection: "column", gap: 3, flex: 1 }}>
                  <span style={{ ...fieldLabelStyle, marginBottom: 0 }}>From</span>
                  <input type="date" value={dateFrom} onChange={(e) => setDateFrom(e.target.value)} style={{ ...fieldStyle, padding: "6px 8px", fontSize: 13 }} />
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 3, flex: 1 }}>
                  <span style={{ ...fieldLabelStyle, marginBottom: 0 }}>To</span>
                  <input type="date" value={dateTo} onChange={(e) => setDateTo(e.target.value)} style={{ ...fieldStyle, padding: "6px 8px", fontSize: 13 }} />
                </div>
                {(dateFrom || dateTo) && (
                  <button onClick={() => { setDateFrom(""); setDateTo(""); }} style={{ background: "transparent", border: "none", color: COLORS.inkSoft, cursor: "pointer", padding: 4, alignSelf: "flex-end" }} aria-label="Clear date filter">
                    <XIcon size={16} />
                  </button>
                )}
              </div>
            )}

            {usedCategories.length > 0 && (
              <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4, marginBottom: 14, WebkitOverflowScrolling: "touch" }}>
                <button onClick={() => setCategoryFilter(null)} style={{ flexShrink: 0, background: categoryFilter === null ? COLORS.cover : "#fff", color: categoryFilter === null ? COLORS.paper : COLORS.inkSoft, border: `1px solid ${categoryFilter === null ? COLORS.cover : COLORS.paperDark}`, borderRadius: 20, padding: "6px 13px", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, cursor: "pointer", whiteSpace: "nowrap" }}>
                  All
                </button>
                {usedCategories.map((c) => (
                  <button key={c} onClick={() => setCategoryFilter(categoryFilter === c ? null : c)} style={{ flexShrink: 0, background: categoryFilter === c ? COLORS.cover : "#fff", color: categoryFilter === c ? COLORS.paper : COLORS.inkSoft, border: `1px solid ${categoryFilter === c ? COLORS.cover : COLORS.paperDark}`, borderRadius: 20, padding: "6px 13px", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, cursor: "pointer", whiteSpace: "nowrap" }}>
                    {c}
                  </button>
                ))}
              </div>
            )}

            {loading && <p style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: COLORS.inkSoft, textAlign: "center", marginTop: 40 }}>opening the ledger…</p>}

            {!loading && list.length === 0 && (
              <div style={{ textAlign: "center", marginTop: 60, padding: "0 24px" }}>
                <TagIcon size={28} color={COLORS.paperDark} style={{ marginBottom: 10 }} />
                <p style={{ fontFamily: "'Newsreader', Georgia, serif", fontSize: 15, color: COLORS.inkSoft, fontStyle: "italic" }}>
                  {query || categoryFilter || dateFrom || dateTo ? "Nothing matches those filters." : "No items logged yet. Scan or add your first price to start the ledger."}
                </p>
              </div>
            )}

            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {list.map((item) => {
                const latest = [...item.prices].sort((a, b) => new Date(b.date) - new Date(a.date))[0];
                return (
                  <button key={item.barcode} onClick={() => setSelectedBarcode(item.barcode)}
                    style={{ display: "flex", alignItems: "center", justifyContent: "space-between", textAlign: "left", background: "#fff", border: `1px solid ${COLORS.paperDark}`, borderLeft: `4px solid ${COLORS.cover}`, borderRadius: 8, padding: "13px 14px", cursor: "pointer" }}>
                    <div style={{ minWidth: 0 }}>
                      <div style={{ fontFamily: "'Newsreader', Georgia, serif", fontSize: 15.5, fontWeight: 600, color: COLORS.ink, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{item.name}</div>
                      <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 3, flexWrap: "wrap" }}>
                        {item.category && (
                          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 9.5, letterSpacing: "0.04em", textTransform: "uppercase", color: COLORS.gold, border: `1px solid ${COLORS.gold}`, borderRadius: 10, padding: "1px 7px" }}>
                            {item.category}
                          </span>
                        )}
                        <TrendBadge prices={item.prices} />
                      </div>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 12, flexShrink: 0, marginLeft: 10 }}>
                      <Sparkline prices={item.prices} />
                      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 17, fontWeight: 600, color: COLORS.stamp }}>{formatMoney(latest.price, currency)}</div>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {!selectedBarcode && (
          <div style={{ position: "fixed", bottom: 22, left: 0, right: 0, display: "flex", justifyContent: "center", gap: 12 }}>
            <button onClick={() => setScanning(true)} style={{ display: "flex", alignItems: "center", gap: 8, background: COLORS.stamp, color: COLORS.paper, border: "none", borderRadius: 30, padding: "14px 22px", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13.5, letterSpacing: "0.03em", boxShadow: "0 6px 18px rgba(0,0,0,0.22)", cursor: "pointer" }}>
              <CameraIcon size={17} /> Scan barcode
            </button>
          </div>
        )}

        {scanning && <ScannerOverlay onDetected={handleDetected} onClose={() => setScanning(false)} />}
        {importing && <ImportOverlay currency={currency} onImport={handleImport} onClose={() => setImporting(false)} />}
      </div>
    </CurrencyContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PriceLedger />);
</script>
</body>
</html>
